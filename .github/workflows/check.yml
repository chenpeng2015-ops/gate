name: VPN Gate Node Check

on:
  workflow_dispatch:
  # 测试通过后，把下面两行取消注释，恢复每天 08:00（北京时间）自动跑：
  # schedule:
  #   - cron: "0 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start local check Worker (workerd, no Cloudflare account needed)
        run: |
          npx --yes wrangler@latest dev --port 8787 > wrangler.log 2>&1 &
          echo $! > wrangler.pid
          echo "waiting for local worker on 127.0.0.1:8787 ..."
          for i in $(seq 1 30); do
            if curl -s -m 5 http://127.0.0.1:8787/ip.json > /dev/null; then
              echo "local worker is up"
              break
            fi
            sleep 2
          done
          curl -s -m 10 http://127.0.0.1:8787/ip.json || (echo "local worker did not start"; cat wrangler.log; exit 1)

      - name: Get VPN Gate nodes + check locally + build page
        run: python vpngate.py
        env:
          # 不再走远程 Cloudflare Worker，改走本地 workerd，DOMAIN Secret 不再需要
          CHECK_WORKER: "http://127.0.0.1:8787/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Stop local check Worker
        if: always()
        run: |
          kill $(cat wrangler.pid) 2>/dev/null || true
          cat wrangler.log | tail -50 || true

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://chenpeng2015-ops.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
